    <path class="soft" d="M41 91a28 28 0 0 1 53-14 22 22 0 1 1 8 43H45a16 16 0 0 1-4-29z"/>
    <path class="ink" d="M41 91a28 28 0 0 1 53-14 22 22 0 1 1 8 43H45a16 16 0 0 1-4-29z"/>
    <path class="ink" d="M72 102V66M56 82l16-16 16 16"/>
