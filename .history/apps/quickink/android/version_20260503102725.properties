# QuickInk Play Store versionCode.
#
# Auto-incremented by the `bumpVersionCode` Gradle task.
# Must strictly increase across every Play upload.
#
# Run this before each Play upload:
#   cd shared/android
#   ./gradlew :apps:quickink:bumpVersionCode :apps:quickink:bundleRelease
#
# versionName (user-facing) still lives in build.gradle.kts and is bumped
# manually when there's a real new release worth a new name.
versionCode=4
