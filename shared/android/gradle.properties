org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX + non-transitive R class: still user-opts in AGP 9.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 migration — see April '26 session notes.
#
# Dropped to the new defaults (build verified on both debug + release):
#   - android.builtInKotlin        (now true; Kotlin auto-applied)
#   - android.newDsl               (now true; ApplicationExtensionImpl)
#   - android.defaults.buildfeatures.resvalues (now false)
#   - android.sdk.defaultTargetSdkToCompileSdkIfUnset (now true; we set both)
#   - android.enableAppCompileTimeRClass (now true)
#   - android.usesSdkInManifest.disallowed (now true; we don't set uses-sdk)
#   - android.r8.optimizedResourceShrinking (now true)
#
# Kept because the new default isn't what we want today:
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# KSP 2.3.2 still registers generated output via the old
# `kotlin.sourceSets` DSL, which AGP 9's built-in Kotlin rejects by
# default with:
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed
#    with built-in Kotlin. Kotlin source set 'debug' contains: …"
# This flag reopens that escape hatch. AGP logs it as experimental
# ("The option setting 'android.disallowKotlinSourceSets=false' is
# experimental. The current default is 'true'.") — that warning is
# expected and the compile actually needs the flag to succeed.
# Attempted to remove on Apr 22 2026 with KSP 2.3.2 + Kotlin 2.2.10;
# the sync error reproduces. Try again after the next KSP bump.
android.disallowKotlinSourceSets=false

# Suppress the "library constraints enabled — enable
# excludeLibraryComponentsFromConstraints for perf" sync warning. Our
# project is nowhere near "very large" so the perf knob doesn't help
# us, and setting it to `true` is itself now deprecated in favor of
# flipping useConstraints off — which breaks other things. The silence
# flag is the clean way out.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Faster clean builds — see `gradle --configuration-cache` output.
org.gradle.configuration-cache=true
